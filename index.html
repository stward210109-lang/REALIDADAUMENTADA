<!DOCTYPE html>
<html>
<head>
<title>Modelo 3D en Realidad Aumentada</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
    margin:0;
    background:#f5f5f5;
    font-family:Arial, sans-serif;
}

h2{
    text-align:center;
}

model-viewer{
    width:100%;
    height:80vh;
}
</style>

</head>

<body>

<h2>Mi modelo en Realidad Aumentada</h2>

<model-viewer
    src="Sin_nombre.glb"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    ar-placement="floor">

    <button slot="ar-button"
    style="
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    padding:15px 25px;
    border-radius:10px;
    border:none;
    background:#4285f4;
    color:white;
    font-size:18px;">
        Ver en mi espacio
    </button>

</model-viewer>

</body>
</html>
